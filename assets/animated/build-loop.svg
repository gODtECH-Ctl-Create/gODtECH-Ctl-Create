<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">gODtECH build loop</title>
  <desc id="desc">Animated loop from problem to product, system, evidence and iteration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#090c14"/><stop offset=".5" stop-color="#101827"/><stop offset="1" stop-color="#090c14"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset=".45" stop-color="#38bdf8"/><stop offset=".72" stop-color="#22c55e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .dash{stroke-dasharray:7 14;animation:dash 3s linear infinite}
      .dot{animation:travel 5s linear infinite}
      .p{animation:p 2.2s ease-in-out infinite}
      .r{transform-box:fill-box;transform-origin:center;animation:r 8s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-42}}
      @keyframes travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(1010px);opacity:0}}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes r{to{transform:rotate(360deg)}}
    </style>
  </defs>
  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <text x="50" y="42" fill="#64748b" font-size="11" letter-spacing="3" class="m">BUILDING LOOP / EXECUTION MODEL</text>
  <text x="50" y="70" fill="#f8fafc" font-size="21" font-weight="700" class="m">Problem → Product → System → Evidence → Iteration</text>

  <path d="M75 126 H1125" stroke="#263246" stroke-width="4" fill="none"/>
  <path class="dash" d="M75 126 H1125" stroke="url(#line)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <circle class="dot" cx="75" cy="126" r="6" fill="#38bdf8" filter="url(#glow)"/>

  <g class="p" fill="#0f172a" stroke-width="2">
    <g transform="translate(75 126)"><circle r="18" stroke="#a78bfa"/><circle r="5" fill="#a78bfa" stroke="none"/><text x="-38" y="55" fill="#f8fafc" font-size="12" class="m">PROBLEM</text></g>
    <g transform="translate(335 126)"><circle r="18" stroke="#38bdf8"/><circle r="5" fill="#38bdf8" stroke="none"/><text x="-36" y="55" fill="#f8fafc" font-size="12" class="m">PRODUCT</text></g>
    <g transform="translate(600 126)"><circle r="18" stroke="#22c55e"/><circle r="5" fill="#22c55e" stroke="none"/><text x="-29" y="55" fill="#f8fafc" font-size="12" class="m">SYSTEM</text></g>
    <g transform="translate(860 126)"><circle r="18" stroke="#f59e0b"/><circle r="5" fill="#f59e0b" stroke="none"/><text x="-38" y="55" fill="#f8fafc" font-size="12" class="m">EVIDENCE</text></g>
    <g transform="translate(1125 126)"><circle r="18" stroke="#f472b6"/><circle r="5" fill="#f472b6" stroke="none"/><text x="-33" y="55" fill="#f8fafc" font-size="12" class="m">ITERATE</text></g>
  </g>

  <g opacity=".55" class="r">
    <path d="M1125 106 A55 55 0 0 1 1070 161" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 7"/>
    <path d="M102 91 A55 55 0 0 1 47 146" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 7"/>
  </g>
  <text x="50" y="194" fill="#475569" font-size="10" class="m">validate small → strengthen foundations → ship useful → repeat</text>
</svg>