<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">gODtECH project orbit</title>
  <desc id="desc">Animated orbit around the active product and systems portfolio.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#172033"/><stop offset="1" stop-color="#07090f"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .orbit{transform-box:fill-box;transform-origin:600px 180px;animation:spin 28s linear infinite}
      .orbit2{transform-box:fill-box;transform-origin:600px 180px;animation:spin2 22s linear infinite}
      .pulse{animation:p 2.6s ease-in-out infinite}
      .signal{stroke-dasharray:4 10;animation:dash 3s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spin2{to{transform:rotate(-360deg)}}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-42}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <text x="42" y="38" fill="#64748b" font-size="11" letter-spacing="3" class="m">ACTIVE PORTFOLIO / SYSTEMS ORBIT</text>

  <g opacity=".7" fill="none" stroke="#334155">
    <ellipse cx="600" cy="180" rx="205" ry="86"/>
    <ellipse cx="600" cy="180" rx="325" ry="132" stroke-dasharray="2 9"/>
    <ellipse cx="600" cy="180" rx="440" ry="165" stroke-dasharray="1 14"/>
  </g>

  <g class="orbit" fill="none">
    <path d="M190 180 A410 150 0 1 0 1010 180 A410 150 0 1 0 190 180" class="signal" stroke="#38bdf8" stroke-width="2" opacity=".45" filter="url(#glow)"/>
    <circle cx="190" cy="180" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <g class="orbit2" fill="none">
    <path d="M275 92 A325 125 0 1 1 925 92" class="signal" stroke="#a78bfa" stroke-width="2" opacity=".35"/>
    <circle cx="275" cy="92" r="4" fill="#a78bfa"/>
  </g>

  <g transform="translate(600 180)">
    <circle r="55" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".3" stroke-width="2"/>
    <circle r="42" fill="none" stroke="#22c55e" stroke-opacity=".18" class="pulse"/>
    <circle r="25" fill="none" stroke="#a78bfa" stroke-opacity=".25" stroke-dasharray="2 5"/>
    <circle r="9" fill="#f8fafc" class="pulse" filter="url(#glow)"/>
    <text x="-37" y="78" fill="#f8fafc" font-size="12" font-weight="700" class="m">gODtECH</text>
    <text x="-44" y="94" fill="#64748b" font-size="9" class="m">PRODUCT STUDIO</text>
  </g>

  <g class="pulse" fill="#0b1220" stroke-width="2">
    <g transform="translate(164 88)"><rect width="155" height="42" rx="12" stroke="#a78bfa"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">SAYRR</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">VOICE / INPUT</text></g>
    <g transform="translate(395 42)"><rect width="175" height="42" rx="12" stroke="#38bdf8"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">MORTGAGEOPS</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">FINANCIAL WORKFLOWS</text></g>
    <g transform="translate(640 42)"><rect width="150" height="42" rx="12" stroke="#22c55e"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">TECHTRACK</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">LEARNING / TALENT</text></g>
    <g transform="translate(875 92)"><rect width="160" height="42" rx="12" stroke="#f59e0b"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">LEAD ENGINE</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">RECRUITMENT INTELLIGENCE</text></g>
    <g transform="translate(885 252)"><rect width="155" height="42" rx="12" stroke="#f472b6"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">ABEMAIL MAIL</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">BUSINESS EMAIL</text></g>
    <g transform="translate(636 286)"><rect width="155" height="42" rx="12" stroke="#38bdf8"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">PROQUREMENT</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">CONSTRUCTION TECH</text></g>
    <g transform="translate(398 286)"><rect width="165" height="42" rx="12" stroke="#22c55e"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">ABE TECHLAB OPS</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">INTERNAL SYSTEMS</text></g>
    <g transform="translate(164 252)"><rect width="165" height="42" rx="12" stroke="#a78bfa"/><text x="14" y="18" fill="#f8fafc" font-size="11" class="m">CLOUD INFRA</text><text x="14" y="33" fill="#64748b" font-size="8" class="m">FOUNDATIONS / PLATFORM</text></g>
  </g>

  <text x="42" y="337" fill="#475569" font-size="9" class="m">SAYRR · MortgageOps · TechTrack · Lead Engine · ABEmail · Proqurement · ABE TechLab Operations · Cloud Infrastructure</text>
</svg>