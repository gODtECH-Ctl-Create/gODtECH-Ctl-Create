<svg width="1400" height="500" viewBox="0 0 1400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10110E"/>
      <stop offset="0.55" stop-color="#171815"/>
      <stop offset="1" stop-color="#0C0D0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1130 116) rotate(90) scale(250 300)">
      <stop stop-color="#B7FF3C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B7FF3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="portraitClip">
      <rect x="1110" y="164" width="172" height="166" rx="20"/>
    </clipPath>
    <style>
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin:center; }
      .pulse2 { animation: pulse 2.2s ease-in-out .8s infinite; transform-origin:center; }
      .float { animation: float 5.4s ease-in-out infinite alternate; }
      .float2 { animation: float2 6.4s ease-in-out infinite alternate; }
      .signal { stroke-dasharray: 7 10; animation: dash 6s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.4); } }
      @keyframes float { from { transform:translateY(0); } to { transform:translateY(-10px); } }
      @keyframes float2 { from { transform:translateY(-4px); } to { transform:translateY(8px); } }
      @keyframes dash { to { stroke-dashoffset:-170; } }
      @media (prefers-reduced-motion: reduce) { .pulse,.pulse2,.float,.float2,.signal { animation:none; } }
    </style>
  </defs>

  <rect width="1400" height="500" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="500" rx="30" fill="url(#grid)"/>
  <rect width="1400" height="500" rx="30" fill="url(#glow)"/>
  <rect x="1" y="1" width="1398" height="498" rx="29" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g opacity="0.13" font-family="Arial, sans-serif" font-weight="700" fill="#FFFFFF">
    <text x="76" y="94" font-size="18">TS</text>
    <text x="298" y="70" font-size="15">REACT</text>
    <text x="540" y="103" font-size="17">NODE</text>
    <text x="1010" y="74" font-size="15">RUST</text>
    <text x="1260" y="118" font-size="16">API</text>
    <text x="94" y="416" font-size="15">POSTGRES</text>
    <text x="463" y="448" font-size="16">DOCKER</text>
    <text x="1028" y="430" font-size="15">AI</text>
    <text x="1240" y="390" font-size="15">SYSTEMS</text>
  </g>

  <g class="float">
    <rect x="70" y="50" width="126" height="34" rx="17" fill="#B7FF3C" fill-opacity="0.12" stroke="#B7FF3C" stroke-opacity="0.28"/>
    <circle cx="89" cy="67" r="5" fill="#B7FF3C" class="pulse"/>
    <text x="104" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#CFFF7C">BUILDING IN PUBLIC</text>
  </g>

  <g>
    <text x="72" y="156" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#9A9D93">PRODUCT × ENGINEERING × SYSTEMS</text>
    <text x="70" y="240" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4" fill="#F7F8F2">Ayo Richard Abe</text>
    <text x="72" y="286" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="1.2" fill="#B7FF3C">gODtECH</text>
    <text x="72" y="332" font-family="Arial, sans-serif" font-size="20" fill="#D7D9D1">Product manager · Product builder · Systems thinker</text>
    <text x="72" y="370" font-family="Arial, sans-serif" font-size="15" fill="#8F9288">Turning difficult problems into useful products, developer systems, and practical technology.</text>
  </g>

  <path d="M72 404 H760" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <path d="M72 404 H760" stroke="#B7FF3C" stroke-opacity="0.65" stroke-width="2" class="signal"/>
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">
    <text x="72" y="440" fill="#F3F4EE">THINK</text><text x="144" y="440" fill="#6F7269">→</text>
    <text x="172" y="440" fill="#F3F4EE">DESIGN</text><text x="255" y="440" fill="#6F7269">→</text>
    <text x="283" y="440" fill="#F3F4EE">BUILD</text><text x="344" y="440" fill="#6F7269">→</text>
    <text x="372" y="440" fill="#F3F4EE">VERIFY</text><text x="448" y="440" fill="#6F7269">→</text>
    <text x="476" y="440" fill="#B7FF3C">SHIP</text>
  </g>

  <g class="float2" filter="url(#shadow)">
    <rect x="900" y="112" width="410" height="278" rx="25" fill="#151713" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="928" y="146" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#797C72">GODTECH / CONTROL BOARD</text>
    <circle cx="1269" cy="142" r="5" fill="#B7FF3C" class="pulse2"/>

    <rect x="928" y="164" width="160" height="82" rx="14" fill="#0F100E" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="946" y="190" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#797C72">LIVE PRODUCTS</text>
    <text x="946" y="229" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#B7FF3C">10</text>

    <rect x="1110" y="164" width="172" height="166" rx="20" fill="#0F100E" stroke="#B7FF3C" stroke-opacity="0.22"/>
    <image href="https://raw.githubusercontent.com/gODtECH-Ctl-Create/gODtECH-Ctl-Create/c08689bc0780fc6aa3695d80523deee4bac2a553/assets/Ayo%20Richard%20Abe.png" x="1110" y="164" width="172" height="166" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
    <rect x="1110" y="300" width="172" height="30" fill="#0F100E" fill-opacity="0.88" clip-path="url(#portraitClip)"/>
    <text x="1124" y="319" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#F5F6EF">AYO RICHARD ABE</text>

    <rect x="928" y="262" width="160" height="68" rx="14" fill="#0F100E" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="946" y="287" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4" fill="#797C72">CURRENT MODE</text>
    <text x="946" y="312" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#F4F5EF">BUILD + SHIP</text>

    <rect x="928" y="344" width="354" height="24" rx="12" fill="#B7FF3C" fill-opacity="0.08"/>
    <circle cx="944" cy="356" r="3.5" fill="#B7FF3C" class="pulse"/>
    <text x="956" y="360" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.1" fill="#AEB1A6">LIVE SYSTEMS · ACTIVE BUILDS · DEVELOPER TOOLING</text>
  </g>

  <circle cx="854" cy="146" r="4" fill="#B7FF3C" class="pulse"/>
  <circle cx="1320" cy="430" r="4" fill="#B7FF3C" class="pulse2"/>
</svg>