name: Refresh contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: gODtECH-Ctl-Create
          outputs: |
            assets/contributions/github-contribution-grid-snake.svg
            assets/contributions/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit refreshed animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions
          if git diff --cached --quiet; then
            echo "No contribution animation changes."
            exit 0
          fi
          git commit -m "chore: refresh contribution animation"
          git push