name: Refresh README media

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/contribution-snake.yml"
      - "scripts/generate_readme_gifs.py"
      - "scripts/generate_contribution_heatmap.py"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image generator
        run: python -m pip install --upgrade Pillow

      - name: Generate README GIF media
        run: |
          python scripts/generate_readme_gifs.py
          python scripts/generate_contribution_heatmap.py

      - name: Commit generated media
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/animated/*.gif
          if git diff --cached --quiet; then
            echo "README media is already up to date."
            exit 0
          fi

          git commit -m "chore: refresh README animation media"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          git push
