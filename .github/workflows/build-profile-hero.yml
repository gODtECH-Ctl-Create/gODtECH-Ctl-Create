name: Build animated profile hero

on:
  push:
    branches:
      - docs/profile-readme-v2
    paths:
      - .github/workflows/build-profile-hero.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/profile-readme-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download GitHub avatar
        run: curl -L --fail --retry 3 'https://github.com/gODtECH-Ctl-Create.png?size=460' -o /tmp/github-avatar.png

      - name: Build animated hero
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import math
          from pathlib import Path

          W, H = 1400, 500
          BG1=(16,17,14); BG2=(12,13,11); PANEL=(21,23,19); INSET=(15,16,14)
          WHITE=(247,248,242); MUTED=(143,146,136); MUTED2=(121,124,114)
          LIME=(183,255,60); LIME_SOFT=(207,255,124)

          def font(size, bold=False):
              p = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
              return ImageFont.truetype(p, size)

          F10=font(10,True); F11=font(11,True); F14=font(14,True); F15=font(15); F20=font(20); F23=font(23,True); F38=font(38,True); F72=font(72,True)

          def rounded_mask(size, radius):
              m=Image.new('L',size,0); d=ImageDraw.Draw(m); d.rounded_rectangle((0,0,size[0]-1,size[1]-1),radius=radius,fill=255); return m

          def crop_fill(img, size):
              return ImageOps.fit(img.convert('RGB'), size, method=Image.Resampling.LANCZOS, centering=(0.5,0.45))

          portrait = Image.open('assets/Ayo Richard Abe.png')
          avatar = Image.open('/tmp/github-avatar.png')
          card_size=(172,166)
          portrait=crop_fill(portrait,card_size)
          avatar=crop_fill(avatar,card_size)
          mask=rounded_mask(card_size,20)

          def base_frame():
              im=Image.new('RGB',(W,H),BG1); p=im.load()
              for x in range(W):
                  t=x/(W-1)
                  c=tuple(int(BG1[i]*(1-t)+BG2[i]*t) for i in range(3))
                  for y in range(H): p[x,y]=c
              d=ImageDraw.Draw(im,'RGBA')
              for x in range(0,W,42): d.line((x,0,x,H),fill=(255,255,255,9),width=1)
              for y in range(0,H,42): d.line((0,y,W,y),fill=(255,255,255,9),width=1)
              d.rounded_rectangle((1,1,W-2,H-2),radius=29,outline=(255,255,255,20),width=2)

              # subtle stack labels
              labels=[(76,82,'TS'),(298,60,'REACT'),(540,92,'NODE'),(1010,62,'RUST'),(1260,108,'API'),(94,410,'POSTGRES'),(463,442,'DOCKER'),(1028,424,'AI'),(1240,386,'SYSTEMS')]
              for x,y,t in labels: d.text((x,y),t,font=F14,fill=(255,255,255,28))

              # status chip
              d.rounded_rectangle((70,50,232,84),radius=17,fill=(183,255,60,28),outline=(183,255,60,70),width=1)
              d.ellipse((84,62,94,72),fill=LIME)
              d.text((104,61),'BUILDING IN PUBLIC',font=F11,fill=LIME_SOFT)

              # identity text
              d.text((72,145),'PRODUCT × ENGINEERING × SYSTEMS',font=F14,fill=(154,157,147))
              d.text((70,184),'Ayo Richard Abe',font=F72,fill=WHITE)
              d.text((72,274),'gODtECH',font=F23,fill=LIME)
              d.text((72,318),'Product manager · Product builder · Systems thinker',font=F20,fill=(215,217,209))
              d.text((72,358),'Turning difficult problems into useful products, developer systems, and practical technology.',font=F15,fill=MUTED)

              d.line((72,404,760,404),fill=(255,255,255,20),width=1)
              d.line((72,404,760,404),fill=(183,255,60,150),width=2)
              chain=[('THINK',72,WHITE),('→',144,MUTED2),('DESIGN',172,WHITE),('→',255,MUTED2),('BUILD',283,WHITE),('→',344,MUTED2),('VERIFY',372,WHITE),('→',448,MUTED2),('SHIP',476,LIME)]
              for t,x,c in chain: d.text((x,428),t,font=F11,fill=c)

              # control board
              d.rounded_rectangle((900,112,1310,390),radius=25,fill=PANEL,outline=(255,255,255,26),width=1)
              d.text((928,136),'GODTECH / CONTROL BOARD',font=F10,fill=MUTED2)
              d.ellipse((1264,137,1274,147),fill=LIME)

              d.rounded_rectangle((928,164,1088,246),radius=14,fill=INSET,outline=(255,255,255,18),width=1)
              d.text((946,180),'LIVE PRODUCTS',font=F10,fill=MUTED2)
              d.text((946,199),'10',font=F38,fill=LIME)

              d.rounded_rectangle((928,262,1088,330),radius=14,fill=INSET,outline=(255,255,255,18),width=1)
              d.text((946,278),'CURRENT MODE',font=F10,fill=MUTED2)
              d.text((946,300),'BUILD + SHIP',font=F14,fill=WHITE)

              d.rounded_rectangle((928,344,1282,368),radius=12,fill=(183,255,60,18))
              d.ellipse((941,352,948,359),fill=LIME)
              d.text((956,351),'LIVE SYSTEMS · ACTIVE BUILDS · DEVELOPER TOOLING',font=F10,fill=(174,177,166))
              return im

          def place_flip(base, img, scale, label):
              d=ImageDraw.Draw(base,'RGBA')
              x,y=1110,164
              w=max(2,int(card_size[0]*scale)); h=card_size[1]
              resized=img.resize((w,h),Image.Resampling.LANCZOS)
              m=rounded_mask((w,h),max(3,int(20*scale)))
              px=x+(card_size[0]-w)//2
              d.rounded_rectangle((x,y,x+card_size[0],y+card_size[1]),radius=20,fill=INSET,outline=(183,255,60,55),width=1)
              base.paste(resized,(px,y),m)
              # footer bar and label only when face is substantially visible
              if scale > .5:
                  alpha=int(220*min(1,(scale-.5)/.5))
                  d.rectangle((px,y+136,px+w,y+166),fill=(15,16,14,alpha))
                  tw=d.textbbox((0,0),label,font=F10)[2]
                  if tw < w-12:
                      d.text((px+max(6,(w-tw)//2),y+145),label,font=F10,fill=(245,246,239,alpha))
              return base

          frames=[]; durations=[]
          # front hold
          frames.append(place_flip(base_frame(),portrait,1.0,'AYO RICHARD ABE')); durations.append(3200)
          # front -> back
          steps=7
          for i in range(1,steps+1):
              angle=(i/steps)*math.pi
              scale=max(.03,abs(math.cos(angle/2))) if i <= steps//2 else max(.03,abs(math.cos(angle/2)))
              # use a true half-turn switch at the narrowest point
              phase=i/(steps+1)
              if phase < .5:
                  s=max(.03,math.cos(phase*math.pi))
                  src,label=portrait,'AYO RICHARD ABE'
              else:
                  s=max(.03,-math.cos(phase*math.pi))
                  src,label=avatar,'GITHUB AVATAR'
              frames.append(place_flip(base_frame(),src,s,label)); durations.append(85)
          frames.append(place_flip(base_frame(),avatar,1.0,'GITHUB AVATAR')); durations.append(3200)
          # back -> front
          for i in range(1,steps+1):
              phase=i/(steps+1)
              if phase < .5:
                  s=max(.03,math.cos(phase*math.pi))
                  src,label=avatar,'GITHUB AVATAR'
              else:
                  s=max(.03,-math.cos(phase*math.pi))
                  src,label=portrait,'AYO RICHARD ABE'
              frames.append(place_flip(base_frame(),src,s,label)); durations.append(85)

          # Palette conversion keeps the README asset compact.
          pal=[]
          for f in frames:
              pal.append(f.quantize(colors=128,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE))

          out=Path('assets/profile-hero.gif')
          pal[0].save(out,save_all=True,append_images=pal[1:],duration=durations,loop=0,optimize=True,disposal=2)
          print(f'generated {out} ({out.stat().st_size} bytes)')
          PY

      - name: Commit generated hero
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-hero.gif
          git commit -m 'docs: add self-contained animated profile hero' || exit 0
          git push origin HEAD:docs/profile-readme-v2
